<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Archmap Review</title>
<script>
  // Applies the theme the viewer stored, so that the picker and the viewer agree.
  try { const t = localStorage.getItem("archmap-theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) { /* storage unavailable */ }
</script>
<meta name="description" content="Chooses a range of commits to review with archmap, and shows the review's progress until the viewer opens.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  /* The same tokens as the viewer, so that moving from the picker to the viewer does not change the palette. */
  :root {
    --bg: #f4f6f4; --surface: #ffffff; --fg: #1c2320; --muted: #68726d; --line: #c5ccc8; --line-strong: #8b948f;
    --accent: #2b6c8c; --added: #2a8a55; --removed: #bf3b2b; --removed-bg: #f9e4e0; --on-accent: #ffffff;
    --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
    --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #13181b; --surface: #1b2125; --fg: #dde4e1; --muted: #8d9893; --line: #363f45; --line-strong: #5c676e;
      --accent: #6fb6d6; --added: #5ccf8a; --removed: #f07763; --removed-bg: #3a1c17; --on-accent: #13181b;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #13181b; --surface: #1b2125; --fg: #dde4e1; --muted: #8d9893; --line: #363f45; --line-strong: #5c676e;
    --accent: #6fb6d6; --added: #5ccf8a; --removed: #f07763; --removed-bg: #3a1c17; --on-accent: #13181b;
    color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 14px; line-height: 1.45; margin: 0; padding: 0 16px 48px; }
  button, input { font: inherit; color: inherit; }
  code { font-family: var(--mono); font-size: 12px; }
  .topbar { display: flex; align-items: baseline; gap: 12px; padding-block: 12px; border-bottom: 1px solid var(--line); max-width: 760px; margin: 0 auto; }
  .brand { font-family: var(--mono); font-weight: 600; letter-spacing: .08em; }
  .repo { color: var(--muted); }
  main { max-width: 760px; margin: 0 auto; }
  h2 { font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); margin: 22px 0 6px; }
  form { display: flex; gap: 8px; margin-top: 18px; }
  input[type=text] { flex: 1; min-width: 0; padding: 7px 10px; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--surface); font-family: var(--mono); font-size: 13px; }
  .primary { padding: 7px 14px; border: 0; border-radius: 6px; background: var(--accent); color: var(--on-accent); font-weight: 500; cursor: pointer; }
  .hint { color: var(--muted); font-size: 12px; margin: 6px 0 0; }
  .error { color: var(--removed); background: var(--removed-bg); border-radius: 6px; padding: 8px 10px; margin-top: 10px; white-space: pre-wrap; font-family: var(--mono); font-size: 12px; }
  ul.ranges { list-style: none; margin: 0; padding: 0; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); overflow: hidden; }
  ul.ranges li + li { border-top: 1px solid var(--line); }
  ul.ranges button { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; width: 100%; text-align: left; padding: 8px 12px; border: 0; background: none; cursor: pointer; }
  ul.ranges button:hover, ul.ranges button:focus-visible { background: var(--bg); outline: none; }
  .label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .detail { color: var(--muted); font-size: 12px; grid-column: 1; }
  .state { grid-row: 1 / span 2; grid-column: 2; align-self: center; color: var(--muted); font-size: 12px; }
  .empty { color: var(--muted); }
  .progress h1 { font-size: 16px; font-weight: 600; margin: 22px 0 2px; }
  .progress .range { color: var(--muted); }
  ol.stages { list-style: none; margin: 14px 0 0; padding: 0; }
  ol.stages li { display: grid; grid-template-columns: 18px 76px 1fr; gap: 8px; padding: 5px 0; align-items: baseline; }
  .mark { width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--line-strong); display: inline-block; }
  .running .mark { border-color: var(--accent); border-right-color: transparent; animation: spin 0.9s linear infinite; }
  .done .mark { border-color: var(--added); background: var(--added); }
  .failed .mark { border-color: var(--removed); background: var(--removed); }
  .stage { font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .message { overflow-wrap: anywhere; }
  details { margin-top: 14px; }
  summary { color: var(--muted); cursor: pointer; }
  pre.log { font-family: var(--mono); font-size: 12px; white-space: pre-wrap; color: var(--muted); margin: 8px 0 0; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .running .mark { animation: none; } }
</style>

<header class="topbar"><span class="brand">ARCHMAP</span><span class="repo" id="repo"></span></header>
<main>
  <section id="picker">
    <form id="form">
      <input type="text" id="range" placeholder="main...feature, abc123..def456, HEAD~3, :worktree" aria-label="Range to review" autocomplete="off" spellcheck="false">
      <button class="primary" type="submit">Review</button>
    </form>
    <p class="hint">A range is <code>a..b</code>, <code>a...b</code> from the merge base as a pull request compares, or one revision against <code>HEAD</code>. <code>:worktree</code> names the uncommitted work.</p>
    <div id="pick-error" class="error" hidden></div>
    <div id="groups"><p class="empty">Reading the repository…</p></div>
  </section>
  <section id="progress" class="progress" hidden>
    <h1 id="p-title"></h1>
    <div class="range" id="p-range"></div>
    <ol class="stages" id="stages"></ol>
    <div id="p-error" class="error" hidden></div>
    <p id="p-back" hidden><a href="/">Choose another range</a></p>
    <details><summary>Log</summary><pre class="log" id="log"></pre></details>
  </section>
</main>

<script>
(function () {
  "use strict";
  const $ = (s) => document.querySelector(s);
  function el(tag, attrs, ...kids) {
    const e = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (k === "class") e.className = v;
      else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
      else e.setAttribute(k, v);
    }
    for (const k of kids) if (k !== null && k !== undefined) e.append(k);
    return e;
  }

  const GROUPS = [["reviews", "Reviews in this session"], ["worktree", "Uncommitted work"], ["branch", "This branch"], ["pulls", "Pull requests"], ["commit", "Recent commits"], ["branches", "Other branches"]];
  const STAGES = [["map", "Map"], ["base", "Base"], ["head", "Head"], ["changeset", "Changeset"]];
  let source = null;

  // Starts a review of a range and follows its progress.
  async function begin(range, label) {
    $("#pick-error").hidden = true;
    const response = await fetch("/api/reviews", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ range, label }) });
    const body = await response.json().catch(() => ({}));
    if (!response.ok) { $("#pick-error").textContent = body.message || `The review could not start (${response.status}).`; $("#pick-error").hidden = false; return; }
    history.pushState(null, "", "/?review=" + encodeURIComponent(body.id));
    follow(body.id, label || range);
  }

  // Lists the ranges the server offers, grouped, with this session's reviews first.
  async function showPicker() {
    if (source) { source.close(); source = null; }
    $("#progress").hidden = true; $("#picker").hidden = false;
    const response = await fetch("/api/ranges");
    const data = await response.json();
    $("#repo").textContent = data.repository;
    document.title = `Archmap Review · ${data.repository}`;
    const byGroup = { reviews: data.reviews.map((r) => ({ label: r.label, detail: r.id, state: r.state, url: r.url })) };
    for (const r of data.ranges) (byGroup[r.group] = byGroup[r.group] || []).push(r);
    const groups = $("#groups");
    groups.replaceChildren();
    for (const [key, title] of GROUPS) {
      const items = byGroup[key] || [];
      if (items.length === 0) continue;
      const ul = el("ul", { class: "ranges" });
      for (const r of items) {
        const open = () => r.url ? (r.state === "ready" ? (location.href = r.url) : (history.pushState(null, "", "/?review=" + encodeURIComponent(r.detail)), follow(r.detail, r.label))) : begin(r.range, r.label);
        ul.append(el("li", {}, el("button", { type: "button", onclick: open, title: r.range || r.label },
          el("span", { class: "label" }, r.label), el("span", { class: "detail" }, r.detail || r.range), r.state ? el("span", { class: "state" }, r.state) : null)));
      }
      groups.append(el("h2", {}, title), ul);
    }
    if (!groups.children.length) groups.append(el("p", { class: "empty" }, "No ranges found. Type one above."));
  }

  // Shows a review's stages as its events arrive, and opens the viewer when it is ready.
  function follow(id, title) {
    if (source) source.close();
    $("#picker").hidden = true; $("#progress").hidden = false;
    $("#p-title").textContent = title || "Review";
    $("#p-range").textContent = id.replace("-", "..");
    $("#p-error").hidden = true; $("#p-back").hidden = true; $("#log").textContent = "";
    const rows = {};
    $("#stages").replaceChildren(...STAGES.map(([key, name]) => {
      rows[key] = el("li", {}, el("span", { class: "mark" }), el("span", { class: "stage" }, name), el("span", { class: "message" }, "waiting"));
      return rows[key];
    }));
    source = new EventSource(`/api/reviews/${encodeURIComponent(id)}/events`);
    source.onmessage = (m) => {
      const e = JSON.parse(m.data);
      if (e.type === "review") {
        $("#p-title").textContent = e.label;
        $("#p-range").textContent = `${e.base.slice(0, 8)}..${e.head.slice(0, 8)}`;
      } else if (e.type === "stage") {
        const row = rows[e.stage];
        if (row) { row.className = "running"; row.querySelector(".message").textContent = e.message; }
        $("#log").textContent += `${e.stage}: ${e.message}\n`;
      } else if (e.type === "ready") {
        source.close(); source = null;
        for (const row of Object.values(rows)) row.className = "done";
        location.replace(e.url);
      } else if (e.type === "failed") {
        source.close(); source = null;
        for (const row of Object.values(rows)) if (row.className === "running") row.className = "failed";
        $("#p-error").textContent = e.message; $("#p-error").hidden = false; $("#p-back").hidden = false;
      }
    };
    // An unknown review, such as one from a server that has since restarted, sends the reader back to the picker.
    source.onerror = () => { if (source && source.readyState === EventSource.CLOSED) { source = null; showPicker(); } };
  }

  function route() {
    const id = new URLSearchParams(location.search).get("review");
    if (id) follow(id, null); else showPicker();
  }

  $("#form").addEventListener("submit", (ev) => { ev.preventDefault(); const r = $("#range").value.trim(); if (r) begin(r, null); });
  $("#p-back").addEventListener("click", (ev) => { ev.preventDefault(); history.pushState(null, "", "/"); showPicker(); });
  window.addEventListener("popstate", route);
  route();
})();
</script>
